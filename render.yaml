# Render blueprint. Point Render at this file (New > Blueprint) and it creates
# the web service with the build and start commands already set.
services:
  - type: web
    name: call-copilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: LLM_API_KEY
        sync: false          # set in the dashboard, never in git
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false          # service_role key
      - key: ALLOWED_ORIGINS
        sync: false          # https://<your-app>.vercel.app
