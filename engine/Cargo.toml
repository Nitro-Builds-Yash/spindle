[package]
name = "spindle-engine"
version = "0.1.0"
edition = "2021"
description = "Spindle's call rules (stage detection, cues, close audit, summaries) in Rust, for the browser via WebAssembly."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
